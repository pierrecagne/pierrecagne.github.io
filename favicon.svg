<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .ring { fill: none; stroke: #2f33a6; stroke-width: 3; }
    .base { fill: #e69f00; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #a3a8f0; } .base { fill: #f2b544; } }
  </style>
  <!-- the circle and its base point -->
  <circle class="ring" cx="16" cy="16" r="11"/>
  <circle class="base" cx="27" cy="16" r="4.5"/>
</svg>
